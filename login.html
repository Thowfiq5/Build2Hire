<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Build2Hire</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- NAVBAR -->
  <header class="navbar" id="main-nav"></header>

  <main class="flex-center" style="min-height: 100vh; padding: 2rem;">
    <div class="card" style="width: 100%; max-width: 420px; padding: 2.5rem;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <a href="index.html" style="font-family: var(--font-display); font-size: 2.2rem; font-weight: 800; color: var(--text-primary); text-decoration: none; display: inline-block; margin-bottom: 0.75rem; letter-spacing: -0.02em;">
          Build2<span style="color: var(--primary);">Hire</span>
        </a>
        <h1 style="font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 0.25rem;">Welcome Back</h1>
        <p style="color: var(--text-secondary); font-size: 0.9rem;">Sign in to continue to Build2Hire</p>
      </div>

      <div id="alert-container"></div>

      <!-- ── Email / Password Form ── -->
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input
            id="email"
            type="email"
            required
            class="form-control"
            placeholder="you@example.com"
          >
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <div class="flex-between" style="margin-bottom: 0.35rem;">
            <label class="form-label" for="password" style="margin: 0;">Password</label>
            <a href="#" onclick="openForgotPasswordModal(event)" style="font-size: 0.8rem; color: var(--primary); text-decoration: none; font-weight: 600;">Forgot Password?</a>
          </div>
          <div style="position: relative; width: 100%;">
            <input
              id="password"
              type="password"
              required
              class="form-control"
              placeholder="••••••••"
              style="padding-right: 2.75rem;"
            >
            <button
              type="button"
              onclick="togglePasswordVisibility('password', this)"
              style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 1.1rem; padding: 0.2rem; display: flex; align-items: center; justify-content: center; outline: none; z-index: 10;"
              title="Show Password"
            >
              👁️
            </button>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Sign In
        </button>
      </form>

      <p style="text-align: center; margin-top: 1.5rem; color: var(--text-secondary); font-size: 0.9rem;">
        Don't have an account? 
        <a href="register.html" style="color: var(--primary); font-weight: 600;">Sign Up</a>
      </p>
    </div>
  </main>

  <!-- 🔑 FORGOT PASSWORD & RESET MODAL -->
  <div id="forgot-password-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(6px); z-index: 99999; align-items: center; justify-content: center; padding: 1.5rem;">
    <div class="card" style="width: 100%; max-width: 440px; padding: 2rem; position: relative; box-shadow: 0 12px 36px rgba(0,0,0,0.5); border: 1px solid var(--border-color);">
      <button onclick="closeForgotPasswordModal()" style="position: absolute; right: 1rem; top: 1rem; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-muted);" title="Close">✕</button>

      <div style="text-align: center; margin-bottom: 1.5rem;">
        <h2 style="font-family: var(--font-display); font-size: 1.4rem; color: var(--text-primary); margin-bottom: 0.25rem;">🔑 Reset Your Password</h2>
        <p style="font-size: 0.85rem; color: var(--text-secondary);" id="fp-subtitle">Enter your registered email address to receive a verification code.</p>
      </div>

      <div id="fp-alert-container"></div>

      <!-- STEP 1: Enter Email -->
      <form id="fp-step-1-form" onsubmit="handleSendResetOTP(event)">
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="form-label" for="fp-email-input">Registered Email Address</label>
          <input type="email" id="fp-email-input" required class="form-control" placeholder="you@example.com">
        </div>
        <button type="submit" id="fp-btn-step1" class="btn btn-primary" style="width: 100%;">
          📧 Send Verification Code
        </button>
      </form>

      <!-- STEP 2: Verify OTP & Reset Password -->
      <form id="fp-step-2-form" style="display: none;" onsubmit="handleResetPasswordSubmit(event)">
        <div class="form-group" style="margin-bottom: 1rem;">
          <label class="form-label" for="fp-otp-input">6-Digit Verification Code</label>
          <input type="text" id="fp-otp-input" required maxlength="6" class="form-control" placeholder="e.g. 782910" style="letter-spacing: 0.25em; font-weight: 700; text-align: center; font-size: 1.15rem;">
          <small style="color: var(--primary); display: block; margin-top: 0.35rem; text-align: center; font-weight: 600;">Verification Code sent: <strong id="fp-generated-otp" style="color:#10b981; font-size: 0.95rem;">782910</strong></small>
        </div>

        <div class="form-group" style="margin-bottom: 1rem;">
          <label class="form-label" for="fp-new-password">New Password</label>
          <div style="position: relative;">
            <input type="password" id="fp-new-password" required class="form-control" placeholder="Min 6 characters" style="padding-right: 2.75rem;">
            <button type="button" onclick="togglePasswordVisibility('fp-new-password', this)" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 1.1rem; padding: 0.2rem;" title="Show Password">👁️</button>
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label class="form-label" for="fp-confirm-password">Confirm New Password</label>
          <div style="position: relative;">
            <input type="password" id="fp-confirm-password" required class="form-control" placeholder="Re-enter new password" style="padding-right: 2.75rem;">
            <button type="button" onclick="togglePasswordVisibility('fp-confirm-password', this)" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 1.1rem; padding: 0.2rem;" title="Show Password">👁️</button>
          </div>
        </div>

        <button type="submit" id="fp-btn-step2" class="btn btn-primary" style="width: 100%;">
          🔒 Update & Reset Password
        </button>
      </form>
    </div>
  </div>

  <script src="shared.js?v=1.0.1"></script>
  <script>
    renderHeader();

    let generatedOTPCode = "";
    let targetResetUserEmail = "";

    function openForgotPasswordModal(e) {
      if (e) e.preventDefault();
      const mainEmail = document.getElementById('email').value;
      if (mainEmail) {
        document.getElementById('fp-email-input').value = mainEmail;
      }
      document.getElementById('fp-step-1-form').style.display = 'block';
      document.getElementById('fp-step-2-form').style.display = 'none';
      document.getElementById('fp-alert-container').innerHTML = '';
      document.getElementById('fp-subtitle').textContent = 'Enter your registered email address to receive a verification code.';
      document.getElementById('forgot-password-modal').style.display = 'flex';
    }

    function closeForgotPasswordModal() {
      document.getElementById('forgot-password-modal').style.display = 'none';
    }

    function handleSendResetOTP(e) {
      e.preventDefault();
      const email = document.getElementById('fp-email-input').value.trim();
      const db = dbGet();
      const user = (db.users || []).find(u => u.email.toLowerCase() === email.toLowerCase());

      if (!user) {
        showAlert('fp-alert-container', '⚠️ No account found registered with this email address. Please check your spelling or sign up.', 'error');
        return;
      }

      targetResetUserEmail = email;
      generatedOTPCode = String(Math.floor(100000 + Math.random() * 900000));
      document.getElementById('fp-generated-otp').textContent = generatedOTPCode;
      document.getElementById('fp-otp-input').value = generatedOTPCode; // Auto-fill for instant testing convenience

      showAlert('fp-alert-container', `✅ Verification Code sent to ${email}! Enter the code below to reset your password.`, 'success');

      document.getElementById('fp-step-1-form').style.display = 'none';
      document.getElementById('fp-step-2-form').style.display = 'block';
      document.getElementById('fp-subtitle').textContent = `Verification code sent to ${email}`;
    }

    function handleResetPasswordSubmit(e) {
      e.preventDefault();
      const enteredOTP = document.getElementById('fp-otp-input').value.trim();
      const newPwd = document.getElementById('fp-new-password').value;
      const confirmPwd = document.getElementById('fp-confirm-password').value;

      if (enteredOTP !== generatedOTPCode) {
        showAlert('fp-alert-container', '❌ Invalid verification code! Please enter the 6-digit code provided.', 'error');
        return;
      }

      if (newPwd.length < 6) {
        showAlert('fp-alert-container', '⚠️ Password must be at least 6 characters long.', 'error');
        return;
      }

      if (newPwd !== confirmPwd) {
        showAlert('fp-alert-container', '❌ Passwords do not match! Please check both password fields.', 'error');
        return;
      }

      // Update password in Local Storage DB
      const db = dbGet();
      const user = (db.users || []).find(u => u.email.toLowerCase() === targetResetUserEmail.toLowerCase());
      if (user) {
        user.password = newPwd;
        dbSave(db);
      }

      showAlert('alert-container', '🎉 Password reset successfully! You can now sign in with your new password.', 'success');
      document.getElementById('password').value = newPwd;
      document.getElementById('email').value = targetResetUserEmail;
      closeForgotPasswordModal();
    }

    // ══════════════════════════════════════════════
    // EMAIL / PASSWORD LOGIN
    // ══════════════════════════════════════════════
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submit-btn');

      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in...";

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.message || "Failed to log in");
        }

        sessionStorage.setItem('user', JSON.stringify(data.data));
        
        if (data.data.role === "admin") {
          window.location.href = "admin-dashboard.html";
        } else if (data.data.role === "recruiter") {
          window.location.href = "recruiter-dashboard.html";
        } else {
          if (data.data.profileCompleted) {
            window.location.href = "jobs.html";
          } else {
            window.location.href = "portfolio.html";
          }
        }
      } catch (err) {
        console.warn("Backend auth offline, using local database fallback:", err.message);
        
        const dbState = dbGet();
        let existingUser = dbState.users.find(u => u.email.toLowerCase() === email.toLowerCase());

        if (email.toLowerCase().includes('admin') || (existingUser && existingUser.role === 'admin')) {
          showAlert('alert-container', '🔒 Direct Admin sign-in on this page is disabled. Double-click the Build2Hire header logo on any page to access the Secret Admin Portal.', 'error');
          return;
        }

        if (!existingUser) {
          showAlert('alert-container', '⚠️ User not found! Please register / sign up first or use default candidate/recruiter accounts.', 'error');
          return;
        }

        sessionStorage.setItem('user', JSON.stringify(existingUser));
        showAlert('alert-container', 'Logged in successfully!', 'success');
        
        setTimeout(() => {
          if (existingUser.role === "admin") {
            window.location.href = "admin-dashboard.html";
          } else if (existingUser.role === "recruiter") {
            window.location.href = "recruiter-dashboard.html";
          } else {
            if (existingUser.profileCompleted) {
              window.location.href = "jobs.html";
            } else {
              window.location.href = "portfolio.html";
            }
          }
        }, 1000);

      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
